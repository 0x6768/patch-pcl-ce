build-and-release:
    name: Build & Release
    needs: check-release
    if: needs.check-release.outputs.has_new == 'true'
    runs-on: ubuntu-latest
    env:
      LANG: en_US.UTF-8

    steps:
      - name: Checkout this repo (patch scripts & vendor files)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download upstream release zipball
        run: |
          raw_tag="${{ needs.check-release.outputs.tag }}"
          # 统一：确保 tag 带 v 前缀（GitHub zip URL 需要）
          if [[ "$raw_tag" == v* ]]; then
            tag="$raw_tag"
          else
            tag="v${raw_tag}"
          fi
          echo "Downloading PCL-CE ${tag}..."
          curl -L "https://github.com/PCL-Community/PCL-CE/archive/refs/tags/${tag}.zip" -o /tmp/upstream.zip

          # 校验下载完整性
          if [ ! -s /tmp/upstream.zip ]; then
            echo "ERROR: Download failed or file is empty"
            exit 1
          fi
          echo "Download OK: $(du -h /tmp/upstream.zip | cut -f1)"

      - name: Extract upstream source
        run: |
          mkdir -p upstream/tmp
          unzip -q /tmp/upstream.zip -d upstream/tmp

          echo "Unzipped contents:"
          ls -la upstream/tmp/

          # 找到顶层目录（GitHub zipball 里只有一个目录）
          top_dir=$(find upstream/tmp -maxdepth 1 -mindepth 1 -type d | head -1)

          if [ -z "$top_dir" ]; then
            echo "ERROR: No directory found in zipball"
            ls -la upstream/tmp/
            exit 1
          fi

          echo "Found top-level dir: $top_dir"
          mv "$top_dir" upstream/src

          rm -rf upstream/tmp

          echo "Extracted to upstream/src/"
          ls upstream/src/

      - name: Apply Patches
        run: |
          cd upstream/src
          # 运行补丁脚本
          python ../../patch.py "PCL.Core/App/Region/RegionPolicy.cs"
          python ../../patch.py "PCL.Core/App/Config.cs"
          # 整文件覆盖
          cp ../../vendor/PageSetupUpdate.xaml.cs "Plain Craft Launcher 2/Pages/PageSetup/PageSetupUpdate.xaml.cs"
          echo "Patches applied."

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x

      - name: Build Project (x86 only)
        env:
          PCL_GITHUB_SHA: ${{ github.sha }}
          PCL_MS_CLIENT_ID: ${{ secrets.CLIENT_ID }}
          # 以下全部不配（砍掉联机/Sentry/CF/NAID）
          # PCL_CURSEFORGE_API_KEY: 不填
          # PCL_SENTRY_DSN: 不填
          # PCL_NAID_CLIENT_ID: 不填
          # PCL_NAID_CLIENT_SECRET: 不填
          # PCL_LINK_SERVER_ROOT: 不填
          # PCL_LOBBY_DEFAULT_SECRET: 不填
          # PCL_WRITE_SECRET: 不填（默认行为更安全）
        run: |
          cd upstream/src
          dotnet publish "Plain Craft Launcher 2/Plain Craft Launcher 2.csproj" \
            -p:Configuration=Release \
            -p:Platform=x86 \
            -p:Version="${{ needs.check-release.outputs.tag }}-patched" \
            -p:InformationalVersion="${{ needs.check-release.outputs.tag }}-patched+${GITHUB_SHA::7}" \
            -p:DeleteExistingFiles=true \
            -o ./artifact \
            --no-self-contained

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.check-release.outputs.tag }}-patched
          name: PCL CE ${{ needs.check-release.outputs.tag }} (RegionPatch)
          body: |
            这是一个修改版本，基于 ${{ needs.check-release.outputs.tag }}。

            修改内容：
            - 区域判定已调整
            - 更新功能已禁用（修改版无法自动更新）

            如需获取原版，请前往：
            https://github.com/PCL-Community/PCL-CE/releases/tag/${{ needs.check-release.outputs.tag }}

            本修改版按《PCL 分发有限许可》发布。
            原作者：龙腾猫跃
            赞助：https://afdian.com/@LTCatJump
          artifacts: upstream/src/artifact/**
          makeLatest: false

      - name: Update .last_tag and push
        run: |
          echo "${{ needs.check-release.outputs.tag }}" > .last_tag
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .last_tag
          git commit -m "chore: update .last_tag to ${{ needs.check-release.outputs.tag }}"
          git push