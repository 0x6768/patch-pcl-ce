name: Watch Upstream & Build Patched

permissions:
  contents: write

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  check-release:
    name: Check Upstream Release
    runs-on: ubuntu-latest
    outputs:
      has_new: ${{ steps.check.outputs.has_new }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - name: Checkout this repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: .last_tag
          sparse-checkout-cone-mode: false

      - name: Get latest upstream release
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 带 token 调用，避免匿名 API 限流（60 次/小时）
          latest=$(curl -s -H "Authorization: token ${GITHUB_TOKEN}" \
            https://api.github.com/repos/PCL-Community/PCL-CE/releases/latest \
            | jq -r .tag_name)

          if [ "$latest" = "null" ] || [ -z "$latest" ]; then
            echo "has_new=false" >> $GITHUB_OUTPUT
            echo "ERROR: failed to fetch latest release"
            exit 0
          fi

          # 统一存成“无 v 前缀”，例如 2.15.1
          clean_tag="${latest#v}"
          echo "tag=${clean_tag}" >> $GITHUB_OUTPUT

          if [ -f .last_tag ]; then
            last=$(cat .last_tag)
          else
            last=""
          fi

          if [ "$clean_tag" != "$last" ]; then
            echo "has_new=true" >> $GITHUB_OUTPUT
            echo "New release: ${clean_tag} (was: ${last})"
          else
            echo "has_new=false" >> $GITHUB_OUTPUT
            echo "No new release. Latest: ${last}"
          fi

  build-and-release:
    name: Build & Release
    needs: check-release
    if: needs.check-release.outputs.has_new == 'true'
    runs-on: ubuntu-latest
    env:
      LANG: en_US.UTF-8

    steps:
      - name: Checkout this repo (patch scripts & vendor files)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download upstream release zipball
        run: |
          clean_tag="${{ needs.check-release.outputs.tag }}"
          # GitHub 的 zip URL 用带 v 的 tag，例如 v2.15.1
          tag="v${clean_tag}"
          echo "Downloading PCL-CE ${tag}..."

          curl -L "https://github.com/PCL-Community/PCL-CE/archive/refs/tags/${tag}.zip" \
            -o /tmp/upstream.zip

          if [ ! -s /tmp/upstream.zip ]; then
            echo "ERROR: download failed or file empty"
            exit 1
          fi
          echo "Download OK: $(du -h /tmp/upstream.zip | cut -f1)"

      - name: Extract upstream source
        run: |
          # 解压到 tmp 子目录，完全不依赖 GitHub 的目录名
          mkdir -p upstream/tmp
          unzip -q /tmp/upstream.zip -d upstream/tmp

          echo "Unzipped contents:"
          ls -la upstream/tmp/

          top_dir=$(find upstream/tmp -maxdepth 1 -mindepth 1 -type d | head -1)

          if [ -z "$top_dir" ]; then
            echo "ERROR: no directory found in zipball"
            ls -la upstream/tmp/
            exit 1
          fi

          echo "Found top-level dir: $top_dir"
          mv "$top_dir" upstream/src
          rm -rf upstream/tmp

          echo "Extracted to upstream/src/"
          ls upstream/src/

      - name: Apply Patches
        run: |
          cd upstream/src
          python ../../patch.py "PCL.Core/App/Region/RegionPolicy.cs"
          python ../../patch.py "PCL.Core/App/Config.cs"
          cp ../../vendor/PageSetupUpdate.xaml.cs \
             "Plain Craft Launcher 2/Pages/PageSetup/PageSetupUpdate.xaml.cs"
          echo "Patches applied."

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x

      - name: Build Project (x86 only)
        env:
          # 只保留微软登录；其余功能（联机/Sentry/CF/NAID）全部砍掉
          PCL_GITHUB_SHA: ${{ github.sha }}
          PCL_MS_CLIENT_ID: ${{ secrets.CLIENT_ID }}
        run: |
          cd upstream/src
          dotnet publish "Plain Craft Launcher 2/Plain Craft Launcher 2.csproj" \
            -p:Configuration=Release \
            -p:Platform=x86 \
            -p:Version="${{ needs.check-release.outputs.tag }}-patched" \
            -p:InformationalVersion="${{ needs.check-release.outputs.tag }}-patched+${GITHUB_SHA::7}" \
            -p:DeleteExistingFiles=true \
            -o ./artifact \
            --no-self-contained

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.check-release.outputs.tag }}-patched
          name: PCL CE ${{ needs.check-release.outputs.tag }} (RegionPatch)
          body: |
            这是一个修改版本，基于 ${{ needs.check-release.outputs.tag }}。

            修改内容：
            - 区域判定已调整
            - 更新功能已禁用（修改版无法自动更新）

            如需获取原版，请前往：
            https://github.com/PCL-Community/PCL-CE/releases/tag/v${{ needs.check-release.outputs.tag }}

            本修改版按《PCL 分发有限许可》发布。
            原作者：龙腾猫跃
            赞助：https://afdian.com/@LTCatJump
          artifacts: upstream/src/artifact/**
          makeLatest: false

      - name: Update .last_tag and push
        run: |
          echo "${{ needs.check-release.outputs.tag }}" > .last_tag
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .last_tag
          git commit -m "chore: update .last_tag to ${{ needs.check-release.outputs.tag }}"
          git push