name: Watch Upstream & Build Patched

permissions:
  contents: write

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  check-release:
    name: Check Upstream Release
    runs-on: ubuntu-latest
    outputs:
      has_new: ${{ steps.check.outputs.has_new }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - name: Checkout this repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: .last_tag
          sparse-checkout-cone-mode: false

      - name: Get latest upstream release
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          latest=$(curl -s -H "Authorization: token ${GITHUB_TOKEN}" \
            https://api.github.com/repos/PCL-Community/PCL-CE/releases/latest \
            | jq -r .tag_name)

          if [ "$latest" = "null" ] || [ -z "$latest" ]; then
            echo "has_new=false" >> $GITHUB_OUTPUT
            echo "ERROR: failed to fetch latest release"
            exit 0
          fi

          clean_tag="${latest#v}"
          echo "tag=${clean_tag}" >> $GITHUB_OUTPUT

          if [ -f .last_tag ]; then
            last=$(cat .last_tag)
          else
            last=""
          fi

          if [ "$clean_tag" != "$last" ]; then
            echo "has_new=true" >> $GITHUB_OUTPUT
            echo "New release: ${clean_tag} (was: ${last})"
          else
            echo "has_new=false" >> $GITHUB_OUTPUT
            echo "No new release. Latest: ${last}"
          fi

  build-and-release:
    name: Build & Release
    needs: check-release
    if: needs.check-release.outputs.has_new == 'true'
    runs-on: windows-latest
    env:
      LANG: en_US.UTF-8

    steps:
      - name: Checkout this repo (patch scripts & vendor files)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download upstream release zipball
        run: |
          $clean_tag = "${{ needs.check-release.outputs.tag }}"
          $tag = "v${clean_tag}"
          Write-Host "Downloading PCL-CE ${tag}..."

          Invoke-WebRequest -Uri "https://github.com/PCL-Community/PCL-CE/archive/refs/tags/${tag}.zip" `
            -OutFile "$env:TEMP\upstream.zip"

          if (-not (Test-Path "$env:TEMP\upstream.zip") -or (Get-Item "$env:TEMP\upstream.zip").Length -eq 0) {
            Write-Error "ERROR: download failed or file empty"
            exit 1
          }
          Write-Host "Download OK: $((Get-Item "$env:TEMP\upstream.zip").Length / 1MB) MB"

      - name: Extract upstream source
        run: |
          New-Item -ItemType Directory -Force -Path upstream/tmp | Out-Null
          Expand-Archive -Path "$env:TEMP\upstream.zip" -DestinationPath upstream/tmp -Force

          Write-Host "Unzipped contents:"
          Get-ChildItem upstream/tmp/

          $top_dir = Get-ChildItem upstream/tmp -Directory | Select-Object -First 1

          if (-not $top_dir) {
            Write-Error "ERROR: no directory found in zipball"
            exit 1
          }

          Write-Host "Found top-level dir: $($top_dir.FullName)"
          Move-Item $top_dir.FullName upstream/src
          Remove-Item -Recurse -Force upstream/tmp

          Write-Host "Extracted to upstream/src/"
          Get-ChildItem upstream/src/

      - name: Apply Patches
        run: |
          cd upstream/src
          python ../../patch.py "PCL.Core/App/Region/RegionPolicy.cs"
          Copy-Item ../../vendor/PageSetupUpdate.xaml.cs `
            "Plain Craft Launcher 2/Pages/PageSetup/PageSetupUpdate.xaml.cs"
          Write-Host "Patches applied."

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x

      - name: Build Project (x64)
        env:
          PCL_GITHUB_SHA: ${{ github.sha }}
          PCL_MS_CLIENT_ID: ${{ secrets.CLIENT_ID }}
        run: |
          cd upstream/src
          dotnet publish "Plain Craft Launcher 2/Plain Craft Launcher 2.csproj" `
            -c Release `
            -r win-x64 `
            --no-self-contained `
            -p:Platform=x64 `
            -p:Version="${{ needs.check-release.outputs.tag }}-patched" `
            -p:InformationalVersion="${{ needs.check-release.outputs.tag }}-patched+${env:GITHUB_SHA::7}" `
            -p:DebugType=none `
            -p:DebugSymbols=false `
            -p:DeleteExistingFiles=true `
            -o ./artifact

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.check-release.outputs.tag }}-patched
          name: PCL CE ${{ needs.check-release.outputs.tag }} (RegionPatch)
          body: |
            这是一个修改版本，基于 ${{ needs.check-release.outputs.tag }}。

            修改内容：
            - 区域判定已调整
            - 更新功能已禁用（修改版无法自动更新）

            如需获取原版，请前往：
            https://github.com/PCL-Community/PCL-CE/releases/tag/v${{ needs.check-release.outputs.tag }}

            本修改版按《PCL 分发有限许可》发布。
            原作者：龙腾猫跃
            赞助：https://afdian.com/@LTCatJump
          artifacts: upstream/src/artifact/**
          makeLatest: false

      - name: Update .last_tag and push
        run: |
          echo "${{ needs.check-release.outputs.tag }}" > .last_tag
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .last_tag
          git commit -m "chore: update .last_tag to ${{ needs.check-release.outputs.tag }}"
          git push